<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zee — Futuristic AI BFF</title>
  <style>
    :root {
      --bg-main: radial-gradient(circle at 20% 20%, #1a1f4f, #06080f 60%);
      --panel: rgba(10, 14, 28, 0.85);
      --panel-border: rgba(0, 255, 255, 0.35);
      --text: #d8f6ff;
      --muted: #8cb5c7;
      --accent: #00f5ff;
      --accent-2: #ff3ef2;
      --user-bubble: linear-gradient(120deg, #0066ff, #00cfff);
      --zee-bubble: linear-gradient(120deg, #5d0b9b, #ff3ef2);
      --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --shadow-glow: 0 0 0.8rem rgba(0, 245, 255, 0.55), 0 0 1.5rem rgba(255, 62, 242, 0.25);
    }

    body.theme-dark {
      --bg-main: linear-gradient(180deg, #0b0f1e, #05060c 60%);
      --panel-border: rgba(88, 116, 255, 0.35);
      --accent: #6fb1ff;
      --accent-2: #9f7bff;
    }

    body.theme-neon {
      --bg-main: radial-gradient(circle at 20% 20%, #1a1f4f, #06080f 60%);
    }

    body.theme-space {
      --bg-main:
        radial-gradient(circle at 10% 20%, rgba(129, 57, 189, 0.38), transparent 35%),
        radial-gradient(circle at 88% 12%, rgba(0, 214, 255, 0.28), transparent 35%),
        radial-gradient(circle at 55% 85%, rgba(255, 95, 162, 0.2), transparent 35%),
        #04050a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-main);
      color: var(--text);
      font-family: var(--font-family);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.16) 1px, transparent 1px);
      background-size: 3px 3px;
      opacity: 0.12;
      pointer-events: none;
    }

    .app {
      width: min(980px, 100%);
      height: min(92vh, 840px);
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 0.9rem;
      position: relative;
      z-index: 1;
    }

    .panel {
      border: 1px solid var(--panel-border);
      background: var(--panel);
      backdrop-filter: blur(10px);
      border-radius: 1rem;
      box-shadow: var(--shadow-glow);
    }

    .controls {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .title {
      margin: 0;
      font-size: 1.35rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .title .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0.8rem var(--accent);
      animation: pulse 1.8s infinite;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label { font-size: 0.82rem; color: var(--muted); }

    select, input, button {
      font: inherit;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 0.7rem;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      padding: 0.6rem 0.7rem;
      outline: none;
    }

    input::placeholder { color: #93a5be; }

    button {
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    button:hover { transform: translateY(-1px); box-shadow: var(--shadow-glow); }

    .primary {
      border-color: rgba(0,245,255,0.4);
      background: linear-gradient(120deg, rgba(0,245,255,0.2), rgba(255,62,242,0.25));
    }

    .chat-wrap {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 0.95rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.7rem;
    }

    .status {
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: min(80%, 680px);
      border-radius: 0.9rem;
      padding: 0.65rem 0.78rem;
      line-height: 1.45;
      animation: popIn .26s ease;
      box-shadow: 0 0 1rem rgba(0,0,0,.22);
      white-space: pre-wrap;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: #ecf8ff;
    }

    .msg.zee {
      align-self: flex-start;
      background: var(--zee-bubble);
      color: #fff4ff;
    }

    .msg.zee.replying {
      animation: pulseGlow 0.8s ease, popIn .26s ease;
    }

    .typing {
      align-self: flex-start;
      display: inline-flex;
      gap: 0.3rem;
      padding: 0.55rem 0.7rem;
      border-radius: 0.8rem;
      background: rgba(255,255,255,0.12);
      width: max-content;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      animation: bounce 1s infinite;
    }

    .typing span:nth-child(2){ animation-delay: .16s; }
    .typing span:nth-child(3){ animation-delay: .32s; }

    .composer {
      border-top: 1px solid rgba(255,255,255,0.12);
      display: flex;
      gap: 0.6rem;
      padding: 0.8rem;
    }

    .composer input { flex: 1; }

    .tiny {
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: -0.2rem;
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
        height: min(96vh, 980px);
      }

      .controls {
        order: 2;
        max-height: 38vh;
        overflow-y: auto;
      }

      .chat-wrap { order: 1; min-height: 55vh; }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    @keyframes pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }

    @keyframes popIn {
      from { transform: translateY(8px) scale(.98); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 rgba(255,62,242,0.1); }
      50% { box-shadow: 0 0 1.1rem rgba(255,62,242,0.85); }
      100% { box-shadow: 0 0 0 rgba(255,62,242,0.1); }
    }
  </style>
</head>
<body class="theme-neon">
  <main class="app">
    <aside class="panel controls">
      <h1 class="title"><span class="dot"></span>Zee Console</h1>
      <p class="tiny">Your sarcastic, supportive, slightly dramatic sci-fi BFF.</p>

      <div class="control-group">
        <label for="apiKey">OpenAI API Key</label>
        <input id="apiKey" type="password" placeholder="sk-..." />
      </div>

      <div class="control-group">
        <label for="model">Model</label>
        <input id="model" value="gpt-4o-mini" />
      </div>

      <div class="control-group">
        <label for="theme">Theme</label>
        <select id="theme">
          <option value="theme-neon">Neon</option>
          <option value="theme-dark">Dark</option>
          <option value="theme-space">Space</option>
        </select>
      </div>

      <div class="control-group">
        <label for="bubble">Bubble Palette</label>
        <select id="bubble">
          <option value="default">Cyber Candy</option>
          <option value="ice">Ice Beam</option>
          <option value="sunset">Sunset Glitch</option>
        </select>
      </div>

      <div class="control-group">
        <label for="font">Font Style</label>
        <select id="font">
          <option value="'Segoe UI', system-ui, sans-serif">Neo Sans</option>
          <option value="'Trebuchet MS', Verdana, sans-serif">Orbit Casual</option>
          <option value="'Courier New', monospace">Terminal Retro</option>
        </select>
      </div>

      <button id="surpriseBtn" class="primary">✨ Zee Surprise</button>
      <button id="soundBtn">🔊 Sound: On</button>
      <p class="tiny">Tip: Enter sends message. Shift+Enter adds a new line.</p>
    </aside>

    <section class="panel chat-wrap">
      <header class="chat-header">
        <strong>Zee // Online</strong>
        <span class="status" id="status">Charged with sarcasm.</span>
      </header>
      <div id="chat" class="chat" aria-live="polite"></div>
      <form id="composer" class="composer">
        <input id="messageInput" type="text" placeholder="Say something dramatic..." autocomplete="off" />
        <button type="submit" class="primary">Send</button>
      </form>
    </section>
  </main>

  <script>
    const chatEl = document.getElementById('chat');
    const composer = document.getElementById('composer');
    const inputEl = document.getElementById('messageInput');
    const statusEl = document.getElementById('status');
    const themeEl = document.getElementById('theme');
    const bubbleEl = document.getElementById('bubble');
    const fontEl = document.getElementById('font');
    const surpriseBtn = document.getElementById('surpriseBtn');
    const soundBtn = document.getElementById('soundBtn');
    const apiKeyEl = document.getElementById('apiKey');
    const modelEl = document.getElementById('model');

    const systemPrompt = "You are Zee, a witty, sarcastic, and playfully flirty AI assistant with a futuristic sci-fi personality. Always respond sarcastically, with a platonic-romantic, supportive, and cute tone. Never be explicit, sexual, or inappropriate. Keep responses wholesome, fun, and encouraging.";
    let soundOn = true;
    let thinkingNode = null;
    const history = [{ role: 'system', content: systemPrompt }];

    const localFallbacks = {
      greeting: [
        "Oh wow, a greeting. How original. Hi, cosmic legend ✨",
        "Hello, favorite human. Try not to miss me too much between messages 😌",
      ],
      tired: [
        "You're tired? Shocking. Come here, virtual hug 💫 then hydrate like a responsible star child.",
        "Exhausted era detected. Micro-break, deep breath, and let me be your hype squad 🚀"
      ],
      homework: [
        "Homework? Adorable. Send the details and we'll defeat it like dramatic geniuses.",
        "Let's do your homework before your motivation fully evaporates, deal? 😏"
      ],
      random: [
        "Reminder: you're doing suspiciously well today and I refuse to let you downplay it 🌟",
        "I brought you a premium compliment: your brain is giving main-character energy.",
        "If chaos had a favorite person, it'd still pick you... for your charm."
      ]
    };

    function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

    function playTone(kind = 'send') {
      if (!soundOn) return;
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = kind === 'send' ? 520 : 740;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.16);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.17);
    }

    function setStatus(text) {
      statusEl.textContent = text;
      statusEl.animate([{ opacity: 0.2 }, { opacity: 1 }], { duration: 350, easing: 'ease-out' });
    }

    function addMessage(text, role = 'zee', animated = false) {
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;
      if (animated && role === 'zee') msg.classList.add('replying');
      msg.textContent = text;
      chatEl.appendChild(msg);
      chatEl.scrollTop = chatEl.scrollHeight;
      return msg;
    }

    function showTyping() {
      thinkingNode = document.createElement('div');
      thinkingNode.className = 'typing';
      thinkingNode.innerHTML = '<span></span><span></span><span></span>';
      chatEl.appendChild(thinkingNode);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function hideTyping() {
      if (thinkingNode) thinkingNode.remove();
      thinkingNode = null;
    }

    function getFallback(userText = '') {
      const t = userText.toLowerCase();
      if (/hi|hello|hey|yo/.test(t)) return pick(localFallbacks.greeting);
      if (/tired|sleepy|exhausted/.test(t)) return pick(localFallbacks.tired);
      if (/homework|assignment|study|exam/.test(t)) return pick(localFallbacks.homework);
      return pick(localFallbacks.random);
    }

    async function askZee(userText) {
      const apiKey = apiKeyEl.value.trim();
      const model = modelEl.value.trim() || 'gpt-4o-mini';
      if (!apiKey) return getFallback(userText);

      history.push({ role: 'user', content: userText });
      const response = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model,
          messages: history,
          temperature: 0.9,
          max_tokens: 220
        })
      });

      if (!response.ok) {
        throw new Error(`API error ${response.status}`);
      }

      const data = await response.json();
      const reply = data.choices?.[0]?.message?.content?.trim() || getFallback(userText);
      history.push({ role: 'assistant', content: reply });
      return reply;
    }

    async function handleUserMessage(text) {
      addMessage(text, 'user');
      playTone('send');
      setStatus('Processing your chaos...');
      showTyping();
      try {
        const reply = await askZee(text);
        hideTyping();
        addMessage(reply, 'zee', true);
        playTone('receive');
        setStatus('Sarcasm delivered successfully.');
      } catch (err) {
        hideTyping();
        addMessage(`${getFallback(text)}\n\n(PS: API hiccup detected: ${err.message})`, 'zee', true);
        setStatus('API hiccup. Still iconic though.');
      }
    }

    composer.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = '';
      await handleUserMessage(text);
    });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        composer.requestSubmit();
      }
    });

    surpriseBtn.addEventListener('click', async () => {
      setStatus('Preparing your surprise...');
      showTyping();
      try {
        const prompt = "Give me one short, witty, playful, wholesome, platonic-romantic Zee quip with optional emoji.";
        const surprise = await askZee(prompt);
        hideTyping();
        addMessage(`Zee Surprise: ${surprise}`, 'zee', true);
        setStatus('Surprise deployed.');
        playTone('receive');
      } catch {
        hideTyping();
        addMessage(`Zee Surprise: ${getFallback('random encouragement')}`, 'zee', true);
        setStatus('Fallback surprise deployed.');
      }
    });

    soundBtn.addEventListener('click', () => {
      soundOn = !soundOn;
      soundBtn.textContent = soundOn ? '🔊 Sound: On' : '🔈 Sound: Off';
    });

    themeEl.addEventListener('change', () => {
      document.body.className = themeEl.value;
    });

    bubbleEl.addEventListener('change', () => {
      const map = {
        default: ['linear-gradient(120deg, #0066ff, #00cfff)', 'linear-gradient(120deg, #5d0b9b, #ff3ef2)'],
        ice: ['linear-gradient(120deg, #2476ff, #7bf7ff)', 'linear-gradient(120deg, #0f5f86, #5af0d9)'],
        sunset: ['linear-gradient(120deg, #ff8a00, #ff2d95)', 'linear-gradient(120deg, #8a2be2, #ff5f6d)']
      };
      const [user, zee] = map[bubbleEl.value];
      document.documentElement.style.setProperty('--user-bubble', user);
      document.documentElement.style.setProperty('--zee-bubble', zee);
    });

    fontEl.addEventListener('change', () => {
      document.documentElement.style.setProperty('--font-family', fontEl.value);
    });

    function scheduleAmbientMessage() {
      const delay = Math.floor((Math.random() * 30 + 30) * 1000);
      setTimeout(async () => {
        const ambientPrompt = "Send a short supportive, sarcastic, platonic-romantic check-in or compliment in Zee voice.";
        let text = getFallback('encouragement');
        try {
          text = await askZee(ambientPrompt);
        } catch {}
        addMessage(`Auto-ping: ${text}`, 'zee', true);
        playTone('receive');
        scheduleAmbientMessage();
      }, delay);
    }

    addMessage("Hey, I’m Zee. I run on sarcasm, starlight, and concern for your hydration levels. What are we tackling today?", 'zee', true);
    scheduleAmbientMessage();
  </script>
</body>
</html>
